server {
    listen 8088;
    server_name _;
    root /var/www/ozon;
    index index.html;
    auth_basic "Ozon";
    auth_basic_user_file /etc/nginx/ozon.htpasswd;
    location / { try_files $uri $uri/ =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        client_max_body_size 32k;
    }
}
